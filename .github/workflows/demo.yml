name: Demo

# Builds the example apps and publishes the demo site (demo/ + example apps)
# to the `gh-pages` branch. Enable GitHub Pages once in the repository
# settings: Settings → Pages → Source: "Deploy from a branch", branch
# `gh-pages`, folder `/ (root)`.
#
#   main          → https://<owner>.github.io/<repo>/
#   other branch  → https://<owner>.github.io/<repo>/preview/<branch>/
#                   (`/` and other unsafe characters in the name become `-`)
#
# Deleting a branch removes its preview. The `delete` event always runs the
# workflow file of the default branch, so cleanup works once this file is on
# `main`.

on:
  push:
    branches-ignore:
      - gh-pages
      - 'dependabot/**'
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    concurrency:
      # One build per branch; a newer push cancels the older build. Pushes to
      # gh-pages from different branches are retried in publish-pages.sh.
      group: demo-pages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Assemble demo site
        run: node tools/build-demo.mjs

      - name: Publish to gh-pages
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          base_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "$BRANCH" = main ]; then
            bash tools/publish-pages.sh main demo-dist
            url="$base_url/"
          else
            slug="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
            bash tools/publish-pages.sh preview "$slug" demo-dist
            url="$base_url/preview/$slug/"
          fi
          echo "Demo: $url"
          echo "### Demo: $url" >> "$GITHUB_STEP_SUMMARY"

  remove-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: demo-pages-refs/heads/${{ github.event.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove preview from gh-pages
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          if [ "$BRANCH" = main ]; then
            exit 0
          fi
          slug="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          bash tools/publish-pages.sh remove "$slug"
